<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      No inline scripts; WebAssembly needs wasm-unsafe-eval. Inline styles are
      allowed for Svelte's style attributes and transitions. Uploads go to any
      https Paperless server (or one on this device).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'self'"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f2ef" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="Scan multi-page documents with automatic edge detection and send clean PDFs to Paperless-ngx."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Scanner" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Doc Scanner</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
